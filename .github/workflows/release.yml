name: Release

# main に push されたとき、package.json の version に対応する Release が
# まだ無ければ、Windows インストーラーをビルドして GitHub Releases に公開する。
# アプリの自動更新はこの Release を参照する。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # latest.yml まで揃っていれば公開済みとみなす (途中で失敗した Release は作り直す)
      - name: Check whether this version is already released
        id: check
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2> /dev/null || true)"
          if echo "$assets" | grep -qx 'latest.yml'; then
            echo "$tag は公開済みのためスキップします"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.check.outputs.build == 'true'

      - name: Build installer
        if: steps.check.outputs.build == 'true'
        run: npm run dist

      # インストーラー・差分情報・latest.yml (自動更新が読むファイル) をまとめて公開する
      - name: Publish release
        if: steps.check.outputs.build == 'true'
        shell: bash
        run: |
          tag="${{ steps.check.outputs.tag }}"
          files=(dist/*.exe dist/*.exe.blockmap dist/latest.yml)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$tag" --notes "Binaural Player $tag"
          fi
