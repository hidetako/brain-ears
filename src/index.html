<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; media-src 'self' blob:">
  <title>Binaural Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Binaural Player</h1>
      <p class="note">ヘッドホン／イヤホンで使用してください</p>
    </header>

    <section class="ears" aria-label="現在の出力">
      <div class="ear">
        <span class="ear-label">左耳</span>
        <span class="ear-freq" id="freqL">—</span>
      </div>
      <div class="beat">
        <span class="ear-label" id="beatLabel">うなり</span>
        <span class="ear-freq" id="beat">—</span>
      </div>
      <div class="ear">
        <span class="ear-label">右耳</span>
        <span class="ear-freq" id="freqR">—</span>
      </div>
    </section>

    <button id="toggle" class="play" type="button">再生</button>

    <section class="panel">
      <h2>音源</h2>
      <div class="modes" role="radiogroup" aria-label="音源">
        <label class="check">
          <input type="radio" name="source" value="tone">
          純音（うなり）
        </label>
        <label class="check">
          <input type="radio" name="source" value="file">
          音声ファイル
        </label>
      </div>
      <div id="filePanel" hidden>
        <div class="file-row">
          <span class="file-label">左ch</span>
          <span class="file-name" id="fileNameL"></span>
          <button type="button" class="small" id="filePickL">選択</button>
          <button type="button" class="small" id="fileClearL">解除</button>
          <input type="file" id="fileInputL" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.opus,.flac,.webm" hidden>
        </div>
        <div class="file-row">
          <span class="file-label">右ch</span>
          <span class="file-name" id="fileNameR"></span>
          <button type="button" class="small" id="filePickR">選択</button>
          <button type="button" class="small" id="fileClearR">解除</button>
          <input type="file" id="fileInputR" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.opus,.flac,.webm" hidden>
        </div>
        <div class="file-row">
          <span class="hint" id="fileHint"></span>
          <button type="button" class="small" id="rewind">先頭に戻す</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>音量（左右別）</h2>
      <div class="modes" role="radiogroup" aria-label="音量の効かせ方">
        <label class="check">
          <input type="radio" name="volumeMode" value="ear">
          耳に固定
        </label>
        <label class="check">
          <input type="radio" name="volumeMode" value="channel">
          チャンネルに固定
        </label>
      </div>
      <p class="hint" id="volumeHint"></p>
      <div class="row">
        <label for="volL">左</label>
        <input type="range" id="volL" min="0" max="100" step="1">
        <input type="number" id="volLNum" min="0" max="100" step="1">
        <span class="unit">%</span>
      </div>
      <div class="row">
        <label for="volBoth">両方</label>
        <input type="range" id="volBoth" min="0" max="100" step="1">
        <input type="number" id="volBothNum" min="0" max="100" step="1">
        <span class="unit">%</span>
      </div>
      <div class="row">
        <label for="volR">右</label>
        <input type="range" id="volR" min="0" max="100" step="1">
        <input type="number" id="volRNum" min="0" max="100" step="1">
        <span class="unit">%</span>
      </div>
    </section>

    <section class="panel" id="freqPanel">
      <h2>周波数</h2>
      <div class="row">
        <label for="diff">左右差</label>
        <input type="range" id="diff" min="0.5" max="20" step="0.1">
        <input type="number" id="diffNum" min="0.5" max="20" step="0.1">
        <span class="unit">Hz</span>
      </div>
      <div class="presets" data-key="diff" role="group" aria-label="左右差をまとめて切り替え">
        <button type="button" class="small" data-value="1">1</button>
        <button type="button" class="small" data-value="2">2</button>
        <button type="button" class="small" data-value="4">4</button>
        <button type="button" class="small" data-value="6">6</button>
        <button type="button" class="small" data-value="10">10</button>
        <button type="button" class="small" data-value="15">15</button>
        <button type="button" class="small" data-value="20">20</button>
      </div>
      <div class="row">
        <label for="base">基準音</label>
        <input type="range" id="base" min="40" max="400" step="1">
        <input type="number" id="baseNum" min="40" max="400" step="1">
        <span class="unit">Hz</span>
      </div>
      <div class="presets" data-key="base" role="group" aria-label="基準音をまとめて切り替え">
        <button type="button" class="small" data-value="100">100</button>
        <button type="button" class="small" data-value="150">150</button>
        <button type="button" class="small" data-value="200">200</button>
        <button type="button" class="small" data-value="250">250</button>
        <button type="button" class="small" data-value="300">300</button>
        <button type="button" class="small" data-value="350">350</button>
        <button type="button" class="small" data-value="400">400</button>
      </div>
    </section>

    <section class="panel">
      <h2>
        <label class="check">
          <input type="checkbox" id="swapEnabled">
          左右を一定時間ごとに入れ替える
        </label>
      </h2>
      <div class="row">
        <label for="swapInterval">間隔</label>
        <input type="range" id="swapInterval" min="0.1" max="5" step="0.1">
        <input type="number" id="swapIntervalNum" min="0.1" max="5" step="0.1">
        <span class="unit">秒</span>
      </div>
    </section>

    <footer>
      <span id="version"></span>
      <span id="update"></span>
    </footer>
  </main>

  <script src="engine.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
